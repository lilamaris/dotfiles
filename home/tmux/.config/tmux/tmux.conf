%if #{XDG_CONFIG_HOME}
  TMUX_CONFIG_HOME="$XDG_CONFIG_HOME/tmux"
%else
  TMUX_CONFIG_HOME="$HOME/.config/tmux"
%endif

%if #{XDG_DATA_HOME}
  TMUX_PLUGIN_MANAGER_PATH="$XDG_DATA_HOME/tpm/plugins"
%else
  TMUX_PLUGIN_MANAGER_PATH="$HOME/.local/share/tpm/plugins"
%endif

source-file "$TMUX_CONFIG_HOME/tmux.options.conf"

source-file "$TMUX_CONFIG_HOME/tmux.bind.conf"

# TPM Configuration

if "test ! -d $TMUX_PLUGIN_MANAGER_PATH/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm $TMUX_PLUGIN_MANAGER_PATH/tpm && $TMUX_PLUGIN_MANAGER_PATH/tpm/bin/install_plugins'"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'egel/tmux-gruvbox'
set -g @plugin 'christoomey/vim-tmux-navigator'

# egel/tmux-gruvbo
set -g @tmux-gruvbox 'dark'

# christoomey/vim-tmux-navigator
set -g @vim_navigator_mapping_left "C-h"  # use C-h and C-Left
set -g @vim_navigator_mapping_right "C-l"
set -g @vim_navigator_mapping_up "C-k"
set -g @vim_navigator_mapping_down "C-j"
set -g @vim_navigator_mapping_prev ""  # removes the C-\ binding

set -g @vim_navigator_pattern '(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'

run "$TMUX_PLUGIN_MANAGER_PATH/tpm/tpm"
