%if #{XDG_CONFIG_HOME}
  TMUX_CONFIG_HOME="$XDG_CONFIG_HOME"
%else
  TMUX_CONFIG_HOME="$HOME/.config/tmux"
%endif

# General
set -g mouse on                       # enable mouse: switch panes/windows, scroll, resize
set -g focus-events on                # pass focus in/out events to applications (needed by nvim)
set -g escape-time 0                  # no ESC delay for key combos
set -g history-limit 9000             # scrollback buffer size (lines)
set -as terminal-features ",alacritty*:RGB"  # enable true color (24-bit RGB) on Alacritty

# Windows/panes numbered from 1, renumber on close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on


# Reload config: prefix r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
source-file "$TMUX_CONFIG_HOME/tmux/bind.conf"
